# Gatsby Build and Deploy to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  schedule:
    # Sincroniza diariamente a las 6:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Notion Database
        run: npm run sync:notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      - name: Sync Notion Experience Database
        run: npm run sync:experience
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_EXPERIENCE_DATABASE_ID: ${{ secrets.NOTION_EXPERIENCE_DATABASE_ID }}

      - name: Build Gatsby site
        run: npm run build
        env:
          GATSBY_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: --openssl-legacy-provider

      # Publicamos en GitHub Pages: si una credencial llega a public/, ya es pública.
      # Este guard es la última línea de defensa antes de subir el artefacto.
      - name: Guard — sin credenciales en el artefacto público
        shell: bash
        run: |
          set -euo pipefail

          PATTERN='(sk-proj-[A-Za-z0-9_-]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{32,}|AIza[0-9A-Za-z_-]{35}|gsk_[A-Za-z0-9]{40,}|ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{60,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'

          if grep -rInE "$PATTERN" public/ 2>/dev/null; then
            echo "::error::Posible credencial encontrada en public/. No se publica."
            exit 1
          fi

          if find public \( -name '.env*' -o -name '*.pem' -o -name '*.key' \) | grep -q .; then
            echo "::error::Archivos sensibles (.env/.pem/.key) dentro de public/."
            exit 1
          fi

          echo "OK: sin credenciales ni archivos sensibles en public/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
